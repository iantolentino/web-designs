    <script>
      // The design-fonts sheet styles 550 gallery thumbnails and pattern
      // boards, not the app shell — fetch it once the page is interactive so
      // it never competes with shell CSS/JS on the critical path.
      addEventListener('load', function () {
        var l = document.getElementById('dv-design-fonts')
        if (l) requestIdleCallback(function () { l.media = 'all' })
      })
    </script>

  <body>
    <div id="root"></div>
    <!-- The app is a client-rendered SPA, so a crawler that does not run JS
         would otherwise see an empty document. This is the same content the
         gallery paints, in static text. -->
    <noscript>
      <h1>The Design Vault</h1>
      <p>
        550 curated, production-grade design systems, 153 layout patterns and 110 components. Each system ships a full
        token set — palette, type pairing, radius, depth, spacing rhythm, motion and accessibility notes — with a live
        preview, a recolorable palette studio, and copy-ready Tailwind, CSS-variable and token-JSON exports.
      </p>
      <p>The vault needs JavaScript for its live previews and filtering.</p>
    </noscript>
